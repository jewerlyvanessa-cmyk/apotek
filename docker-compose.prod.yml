# Production compose — beli putus / on-prem
# Usage:
#   cp api/.env.example api/.env   # edit secrets & DEPLOYMENT_MODE=on_prem
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy

services:
  postgres:
    image: postgres:16-alpine
    container_name: apotikflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apotikflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-apotikflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - apotikflow

  redis:
    image: redis:7-alpine
    container_name: apotikflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - apotikflow

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: apotikflow-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apotikflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apotikflow}?schema=public
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-apotikflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apotikflow}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apotikflow

volumes:
  postgres_data:
  redis_data:
  api_data:

networks:
  apotikflow:
    driver: bridge
